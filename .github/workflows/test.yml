name: Test Docs

on:
  pull_request:

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Build Docs
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |-
          pnpm docs:build
          test -f docs/dist/index.html
          # Preview/build must not replace reviewed Traditional Chinese pages.
          git diff --exit-code -- docs/tw
          touch docs/dist/.nojekyll

      - name: Linter Test
        run: pnpm lint
