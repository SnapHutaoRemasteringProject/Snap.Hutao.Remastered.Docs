name: Build Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate scripts and manifest
        run: pnpm lint

      - name: Build VitePress documentation
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          pnpm run docs:build
          test -f docs/dist/index.html
          git diff --exit-code -- docs/tw

      - name: Upload site build artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/dist/
          if-no-files-found: error
          retention-days: 7
